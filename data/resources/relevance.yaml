# Relevance gate for live ingestion (M10a, D22).
#
# General news feeds (The Hindu, HT, TOI ...) mostly carry stories the model was
# never trained on - fuel prices, train timetables, elections. The classifier has
# no "not defence news" class, so it would force every one of them into Security,
# Political, ... Only articles that pass this gate are classified.
#
# Terms = this file + the rubric terms in keywords.yaml (low-precision ones
# excluded), word-boundary matched. An article passes when a term is in the
# HEADLINE, or 2+ DIFFERENT terms are in the text (ingestion/relevance.py).
#
# The rubric alone is not enough: any-hit on it keeps only 71% of the 1,064 gold
# articles (51% of headline-only ones) - it was written to tell defence stories
# APART, not to recognise defence news. Gold recall with this file and the
# headline-or-2 rule: see D22 (99.2%; 99.7% for any single hit, which also let
# in Durga Puja and Mbappe stories on the first live pass). Measured on full
# text; gating on the headline + first 600 characters drops bodied recall to
# 90%, so the gate reads all the text the feed provides.
#
# Caveat: the gold corpus was itself collected by keyword search, so recall on
# it is an upper bound on live recall.
#
# Removed after the first live pass: veteran/veterans ("BJP veteran loses").
#
# Words are deliberately broad (police, killed, arrested): the corpus includes
# crime, unrest and disaster-response stories under Civilian and Investigation.

# Matched case-INsensitively. List plurals explicitly - there is no stemming.
