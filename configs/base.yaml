# Base training/eval configuration. Model-specific files override these.
# Tuned for the PRIMARY target: RTX 3050 Laptop 6 GB / Ryzen 5 7235HS / 11.7 GB RAM.

seed: 42
seeds: [42, 1337, 2024]      # small-data fine-tuning is seed-sensitive; report mean and std

data:
  gold_csv: data/raw/gold_dataset.csv
  # "body_only" (571 rows) is PRIMARY. "all" (1053) is run as the confound
  # measurement, not as the headline number. See docs/DECISIONS.md D2.
  mode: body_only            # body_only | all
  headline_col: clean_headline
  body_col: clean_text
  # Prepended to headline-only rows in mode=all so the model can at least
  # distinguish the two regimes rather than silently learning "short -> Low".
  no_body_marker: "[NO_BODY]"

dedupe:
  # Exact and near duplicates get different treatment, because they are
  # different problems:
  #   exact  - the same article twice. Carries no extra information; keep one.
  #            11 rows corpus-wide.
  #   near   - a syndicated rewrite (0.85 <= sim < 1.0). Genuinely different
  #            text, so both are kept - but they must land in the SAME fold or
  #            the model is tested on something it trained on. 28 pairs / 20
  #            rows still leak after exact dedupe alone.
  # Grouping rather than dropping the near-dupes matters because the rare
  # classes cannot spare a single example.
  similarity: 0.85           # char_wb 3-5gram TF-IDF cosine on headline
  strip_source_suffix: true  # google news appends " - Publisher"
  drop_exact: true
  group_near: true
  # A CV row whose duplicate group also contains a test.csv row would leak
  # into the final hold-out. Drop it from the CV pool; test.csv stays intact.
  exclude_holdout_leaks: true

split:
  # 5-fold stratified GROUP CV. Stratify on narrative (the scarcer target);
  # severity stratifies acceptably as a side effect.
  strategy: stratified_group_kfold
  n_folds: 5
  stratify_on: narrative
  group_on: dupe_group
  # The 7 propaganda positives are spread round-robin across folds so no test
  # fold has zero positives. Expected ~1.4 per fold - diagnostic only.
  balance_rare_positives: [propaganda]
  # Held out and untouched until the very end. NOTE: the plan PDF asks for CV
  # over all 1,064 AND an untouched test.csv - those contradict, since
  # test.csv is a subset. See docs/DECISIONS.md D1.
  final_holdout: data/raw/test.csv

tokenizer:
  max_length: 512            # ablate 256 / 512 / 1024
  # Pad each batch to its own longest sequence, not to max_length: identical
  # results, less wasted compute on short articles.
  padding: longest
  truncation: true

model:
  name: jhu-clsp/mmBERT-small
  pooling: cls               # cls | mean
  dropout: 0.1
  # sdpa never materialises the full 512x512 attention matrix. Measured on the
  # RTX 3050, mmBERT-small batch 8: eager 4.73 GB peak -> sdpa 3.36 GB.
  # (flash-attn proper is unavailable on Windows; sdpa is the portable option.)
  attn_implementation: sdpa
  # Freeze the word-embedding table. It holds most of each model's parameters
  # (192 M of XLM-R's 278 M) as lookup rows this corpus barely touches - the
  # plan's own S3.1 argument. Without it, XLM-R's weights + grads + AdamW
  # state alone are ~4.4 GB and do not fit beside the Windows desktop, which
  # shares this GPU. Measured: XLM-R batch 4 5.25 GB -> 2.71 GB.
  # See docs/DECISIONS.md D9.
  freeze_embeddings: true

heads:
  narrative:  {enabled: true,  n_classes: 5, loss_weight: 1.0, class_weight: balanced}
  severity:   {enabled: true,  n_classes: 2, loss_weight: 1.0, class_weight: balanced}
  # RETAINED by explicit decision (docs/DECISIONS.md D3). Down-weighted, and
  # the positive class weight is CAPPED - 'balanced' on 7 positives would hand
  # the positive class a ~150x multiplier and the model would predict Yes for
  # everything.
  propaganda: {enabled: true,  n_classes: 2, loss_weight: 0.3, class_weight: balanced,
               class_weight_cap: 10.0, report_as: diagnostic}

keywords:
  # The user's directive: the rubric should help the model classify.
  # Measured as an ablation, not assumed. Features are computed over the FULL
  # untruncated document - that is the whole point, since max_len=512 sees
  # only 17.3% of bodied articles in full.
  enabled: true
  resource: data/resources/keywords.yaml
  mode: group_counts         # off | group_counts (11-dim) | per_keyword (~130-dim) | markers
  transform: log1p
  exclude_low_precision: false   # keep the rubric faithful for fusion
  fuse_at: cls               # concatenated to the pooled vector before the heads

training:
  # The plan's "5 epochs, patience 2" was calibrated on 744 training rows. The
  # body_only inner-train split here is ~335 rows - about 21 optimizer steps an
  # epoch at effective batch 16, so 5 epochs is ~105 steps and likely
  # undertrained. 10 epochs with early stopping still guards against overfit.
  # See docs/DECISIONS.md D8.
  epochs: 10
  # false = fixed schedule: no inner-val split, every non-test row trains, and
  # the final epoch is kept. M5 found early stopping adds nothing on average
  # (selected minus final: -0.005/-0.002 narrative over 30 runs) while costing
  # 47 training rows. M6 ablation 1 tests switching it off.
  early_stopping: true
  patience: 3
  # Early epochs often sit at majority-class F1 while the randomly initialised
  # heads warm up. Without a floor, patience can fire before learning starts.
  min_epochs: 3
  # mean of inner-val narrative macro-F1 and severity F1(High). Watching
  # narrative alone let severity decay unchecked: in the M4 fold-0 run severity
  # peaked at epoch 5 and fell while narrative peaked at 10. See D10.
  monitor: combined              # narrative_macro_f1 | combined
  # Carved from the training fold with StratifiedGroupKFold, so near-duplicates
  # never straddle inner-train and inner-val either. The outer test fold is
  # never touched until after training.
  inner_val_size: 0.12
  batch_size: 8
  grad_accum: 2              # effective batch 16
  eval_batch_size: 16
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: linear
  max_grad_norm: 1.0
  # bf16 over fp16: same memory, no loss scaling, no overflow. The RTX 3050
  # (Ampere) supports it - M1 reported bf16 supported: True. Fall back to fp16
  # here if a run reports a non-finite loss.
  amp: true
  amp_dtype: bf16            # bf16 | fp16
  # Score the outer test fold every epoch FOR THE RECORD ONLY - it never feeds
  # checkpoint selection. It measures whether early stopping on a 47-row
  # inner-val set picks well. Legitimate because the CV is now a development
  # set and test.csv stays held out for the final number (D1, D11).
  track_test_fold: true
  gradient_checkpointing: false   # turn on for max_length >= 1024
  num_workers: 0             # Windows spawn overhead; 4 physical cores

evaluation:
  primary_metric: narrative_macro_f1
  report:
    - narrative_macro_f1          # 5-class
    - narrative_collapsed_macro_f1 # 3-class - the meaningful headline number
    - severity_f1_high
    - propaganda_f1_pos           # diagnostic only, always with prop_n_pos_test
  confusion_matrix: true
  # Every severity metric is also broken out by has_body. A classifier fed
  # ONLY the has_body flag scores F1(High)=0.478 - the confound is real and
  # must stay visible.
  stratify_by: [has_body]
  # Plan PDF S5.2: inter-annotator agreement is 74.3% narrative / 79.9%
  # severity. Anything dramatically above this is a leakage alarm, not success.
  leakage_alarm:
    narrative_accuracy_above: 0.92

baselines:
  - majority
  - tfidf_logreg
  - keyword_rules      # 31 severity terms alone score F1(High)=0.685

paths:
  runs_dir: runs
  cache_dir: .cache
