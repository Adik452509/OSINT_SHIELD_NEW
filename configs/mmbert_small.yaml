# Primary candidate. Fewest trainable non-embedding parameters (42 M body),
# which is what matters on a ~500-row training fold. 8,192 context removes
# truncation entirely - relevant here because the median BODIED article is
# 859 tokens and only 17.3% fit inside 512.
extends: base.yaml

model:
  name: jhu-clsp/mmBERT-small
  # The model's own config ships `classifier_pooling: mean`. Position 0 is
  # <bos>, which MLM-only pretraining never trained as a sentence summary, and
  # 2 of every 3 ModernBERT layers use local attention (window 128) - so a
  # <bos> vector mostly sees the first ~64 tokens of a 512-token article.
  # M5 ran with `cls` against the model's design. See docs/DECISIONS.md D11.
  pooling: mean

# Fits comfortably on 6 GB at 512 tokens.
training:
  batch_size: 8
  grad_accum: 2
