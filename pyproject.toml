[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-shield"
version = "0.1.0"
description = "Transformer fine-tuning and real-time classification for OSINT defence & security news"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

# NOTE: torch is deliberately NOT listed here. The default PyPI wheel is
# CPU-only; this project targets an RTX 3050 and needs the CUDA wheel from
# PyTorch's own index. See README "Install" for the exact command.
dependencies = [
    "transformers>=4.48",
    "tokenizers>=0.21",
    "safetensors>=0.4",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
]
ingest = [
    "feedparser>=6.0",
    "requests>=2.32",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
]
llm = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a model download or a training run",
    "gpu: requires CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]
